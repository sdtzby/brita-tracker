<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="30%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="innerWave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="#0b121e"/>
  <circle cx="256" cy="270" r="220" fill="url(#bgGlow)"/>

  <!-- Outer Ring Indicator -->
  <circle cx="256" cy="265" r="170" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14"/>
  <path d="M 256 95 A 170 170 0 1 1 120 370" fill="none" stroke="url(#dropGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Water Drop Icon -->
  <g transform="matrix(0.85 0 0 0.85 38.4 50)">
    <path d="M 256 120 C 256 120 160 250 160 320 C 160 375 203 418 256 418 C 309 418 352 375 352 320 C 352 250 256 120 256 120 Z" 
          fill="url(#innerWave)"/>
    <!-- Highlight Reflection -->
    <path d="M 230 180 C 230 180 185 270 185 315 C 185 345 205 375 230 380 C 215 370 202 345 202 315 C 202 270 230 200 230 180 Z" 
          fill="white" opacity="0.45"/>
    <circle cx="295" cy="340" r="14" fill="white" opacity="0.3"/>
  </g>

  <!-- Text Badge 150L -->
  <rect x="186" y="405" width="140" height="42" rx="21" fill="#00f2fe" opacity="0.15"/>
  <rect x="186" y="405" width="140" height="42" rx="21" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>
  <text x="256" y="433" text-anchor="middle" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="2">150L</text>
</svg>
